name: Android APK
# Supabase account integration build
# Rebuild after authentication email-domain fix

on:
  push:
    branches: [main, replace-with-pharaoh-party]
    paths: ['app/**','Backend/**','build.gradle.kts','settings.gradle.kts','gradle/**','.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Test Supabase username and quick authentication
        shell: bash
        env:
          SUPABASE_URL: https://fdvgpdfesvigtvmzjhnt.supabase.co
          SUPABASE_KEY: sb_publishable_gW5LE2T9Y6rfv63DMHnYew_64sa1cOL
        run: |
          set -euo pipefail
          USERNAME="ci_user_$GITHUB_RUN_ID"
          PASSWORD="CiTest_$GITHUB_RUN_ID_A9!"
          DISPLAY_NAME="CI Login Test"
          AUTH_URL="$SUPABASE_URL/functions/v1/pharaoh-auth"

          register_json="$(curl --fail-with-body -sS -X POST "$AUTH_URL"             -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json"             --data "$(jq -nc --arg u "$USERNAME" --arg p "$PASSWORD" --arg n "$DISPLAY_NAME" '{mode:"register",username:$u,password:$p,display_name:$n}')")"
          echo "$register_json" | jq -e '.ok == true and (.user_id | length) > 0 and (.access_token | length) > 0' >/dev/null

          login_json="$(curl --fail-with-body -sS -X POST "$AUTH_URL"             -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json"             --data "$(jq -nc --arg u "$USERNAME" --arg p "$PASSWORD" '{mode:"login",username:$u,password:$p}')")"
          LOGIN_USER_ID="$(echo "$login_json" | jq -r '.user_id')"
          REGISTER_USER_ID="$(echo "$register_json" | jq -r '.user_id')"
          test -n "$LOGIN_USER_ID"
          test "$LOGIN_USER_ID" = "$REGISTER_USER_ID"
          ACCESS_TOKEN="$(echo "$login_json" | jq -r '.access_token')"

          profile_json="$(curl --fail-with-body -sS "$SUPABASE_URL/rest/v1/profiles?select=id,username,display_name&id=eq.$LOGIN_USER_ID"             -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $ACCESS_TOKEN")"
          echo "$profile_json" | jq -e --arg id "$LOGIN_USER_ID" --arg u "$USERNAME" '. | length == 1 and .[0].id == $id and .[0].username == $u' >/dev/null

          QUICK_DEVICE="ci-device-$GITHUB_RUN_ID-pharaoh-party"
          quick1="$(curl --fail-with-body -sS -X POST "$AUTH_URL"             -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json"             --data "$(jq -nc --arg d "$QUICK_DEVICE" '{mode:"quick",device_key:$d}')")"
          quick2="$(curl --fail-with-body -sS -X POST "$AUTH_URL"             -H "apikey: $SUPABASE_KEY" -H "Content-Type: application/json"             --data "$(jq -nc --arg d "$QUICK_DEVICE" '{mode:"quick",device_key:$d}')")"
          Q1="$(echo "$quick1" | jq -r '.user_id')"
          Q2="$(echo "$quick2" | jq -r '.user_id')"
          test -n "$Q1"
          test "$Q1" = "$Q2"
          echo "AUTH TEST PASSED: normal register/login and repeated quick login returned stable Supabase identities."

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verified: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: pharaoh-party-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
