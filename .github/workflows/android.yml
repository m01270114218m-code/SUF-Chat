name: Android APK

on:
  push:
    branches: [main, replace-with-pharaoh-party]
    paths: ['app/**','Backend/**','build.gradle.kts','settings.gradle.kts','gradle/**','.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon clean :app:assembleDebug

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          file "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK verified: $APK"

      - uses: actions/upload-artifact@v4
        with:
          name: pharaoh-party-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
