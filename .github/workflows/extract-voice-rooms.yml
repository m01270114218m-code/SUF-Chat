name: Flatten VoiceRooms ZIP into project root

on:
  push:
    paths:
      - ".github/workflows/extract-voice-rooms.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatten:
    if: ${{ !startsWith(github.event.head_commit.message, 'Flatten VoiceRooms ZIP') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace project root with ZIP project contents
        shell: bash
        run: |
          set -e
          rm -rf /tmp/voice-rooms
          mkdir -p /tmp/voice-rooms
          unzip -q -o "_workspace_VoiceRooms-Android.zip" -d /tmp/voice-rooms
          test -d /tmp/voice-rooms/VoiceRooms
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '_workspace_VoiceRooms-Android.zip' ! -name '.github' -exec rm -rf {} +
          cp -a /tmp/voice-rooms/VoiceRooms/. .
          rm -f .github/workflows/extract-voice-rooms.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- "_workspace_VoiceRooms-Android.zip"
          git commit -m "Flatten VoiceRooms ZIP into project root"
          git push origin HEAD:main
