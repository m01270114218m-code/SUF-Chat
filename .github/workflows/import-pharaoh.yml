name: Replace project from supplied archive

on:
  push:
    branches: [replace-with-pharaoh-party]
    paths: [.github/workflows/import-pharaoh.yml]

permissions:
  contents: write

jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download supplied archive
        run: |
          curl -L --fail --retry 3 -o /tmp/pharaoh-party.zip 'https://pharaoh-party.floot.app/_cdn/static/854a958a-7a22-4a42-9637-6a1a9aed1964-pharaoh-party-replacement.zip'
          unzip -t /tmp/pharaoh-party.zip
      - name: Replace repository contents
        run: |
          mkdir /tmp/project
          unzip -q /tmp/pharaoh-party.zip -d /tmp/project
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/project/. .
          rm -f /tmp/pharaoh-party.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace project with supplied Pharaoh Party Android app' || exit 0
          git push origin HEAD:replace-with-pharaoh-party
