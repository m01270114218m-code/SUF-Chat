name: Replace repository from bundled ZIP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  replace:
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'Replace project with recovered new project') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract new project
        shell: bash
        run: |
          set -euo pipefail
          ZIP="ttwyr-ttbyq-drdsht-swtyt.zip"
          test -f "$ZIP"
          rm -rf /tmp/new-project
          mkdir -p /tmp/new-project
          unzip -q "$ZIP" -d /tmp/new-project
          shopt -s dotglob nullglob
          items=(/tmp/new-project/*)
          if [ "${#items[@]}" -eq 1 ] && [ -d "${items[0]}" ]; then
            SRC="${items[0]}"
          else
            SRC="/tmp/new-project"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          rm -rf /tmp/new-project

      - name: Commit replacement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace project with recovered new project"
          git push origin HEAD:main
