<!doctype html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فرعون بارتي — لوحة التحكم</title>
<style>
body{margin:0;font-family:system-ui;background:#10061f;color:#fff}header{padding:18px 22px;background:linear-gradient(120deg,#3b146d,#9b2cff);display:flex;justify-content:space-between;align-items:center}main{padding:20px;max-width:1200px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.card{background:#1d1030;border:1px solid #5d3380;border-radius:16px;padding:16px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}input,select,button{border-radius:10px;border:1px solid #68428b;padding:10px;background:#13091f;color:#fff}button{cursor:pointer;background:#7c3aed}.danger{background:#b4235a}.hidden{display:none}.asset{display:flex;gap:12px;align-items:center}.asset img{width:64px;height:64px;object-fit:contain;border-radius:12px;background:#fff2}.tabs button{margin:4px}.status{padding:8px 12px;border-radius:10px;background:#21102f}
</style></head>
<body>
<header><b>👑 فرعون بارتي — لوحة التحكم</b><span id="who"></span></header>
<main>
<section id="login" class="card"><h2>دخول الإدارة</h2><div class="row"><input id="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button id="loginBtn">دخول</button></div><p id="loginMsg"></p></section>
<section id="app" class="hidden">
<div class="tabs"><button data-tab="assets">الأصول والمظهر</button><button data-tab="features">إظهار/إخفاء</button><button data-tab="store">المتجر</button><button data-tab="users">الحسابات والوكالات</button><button id="logout" class="danger">خروج</button></div>
<div id="assets" class="tab"></div><div id="features" class="tab hidden"></div><div id="store" class="tab hidden"></div><div id="users" class="tab hidden"></div>
</section></main>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const sb=createClient('https://fdvgpdfesvigtvmzjhnt.supabase.co','sb_publishable_gW5LE2T9Y6rfv63DMHnYew_64sa1cOL');
const $=id=>document.getElementById(id); const msg=(t)=>$('loginMsg').textContent=t;
async function isAdmin(){const {data:{user}}=await sb.auth.getUser(); if(!user)return false; const {data}=await sb.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle(); return !!data}
async function boot(){if(await isAdmin()){const {data:{user}}=await sb.auth.getUser();$('who').textContent=user.email;$('login').classList.add('hidden');$('app').classList.remove('hidden');loadAll()}else{await sb.auth.signOut()}}
$('loginBtn').onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg(error.message);if(!await isAdmin()){await sb.auth.signOut();return msg('هذا الحساب ليس مديراً')}boot()};
$('logout').onclick=()=>sb.auth.signOut().then(()=>location.reload());
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));$(b.dataset.tab).classList.remove('hidden')});
async function loadAll(){loadAssets();loadFeatures();loadStore();loadUsers();loadAgencies();loadTheme()}
async function loadTheme(){const {data}=await sb.from('ui_theme').select('*').eq('id',1).maybeSingle();const a=document.getElementById('assets');a.innerHTML+=`<div class="card"><h2>🌈 مظهر التطبيق</h2><form id="themeForm" class="grid">${['app_name','primary_color','secondary_color','background_color','surface_color','text_color','muted_text_color','border_color','accent_color','radius','logo_url','app_icon_url','background_image_url'].map(k=>`<input name="${k}" placeholder="${k}" value="${(data&&data[k])||''}">`).join('')}<button>حفظ المظهر في Supabase</button></form></div>`;document.getElementById('themeForm').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target).entries());d.id=1;d.updated_at=new Date().toISOString();const {error}=await sb.from('ui_theme').upsert(d,{onConflict:'id'});if(error)alert(error.message);else alert('تم حفظ المظهر')}}
async function loadAssets(){const {data,error}=await sb.from('ui_assets').select('*').order('z_index').order('sort_order');let h='<div class="card"><h2>🎨 الأصول المتحكم بها من Supabase</h2><form id="assetForm"><div class="row"><input name="area" placeholder="area: frame / entry / mic / home"><input name="key" placeholder="asset_key"><input name="label" placeholder="الاسم"><select name="type"><option>image</option><option>gif</option><option>webp</option><option>svga</option><option>mp4</option><option>animation</option></select><input name="url" placeholder="رابط الصورة/الفيديو الشفاف"><input name="file" type="file"><input name="x" placeholder="X"><input name="y" placeholder="Y"><input name="w" placeholder="العرض"><input name="h" placeholder="الارتفاع"><button>إضافة/تحديث</button></form><p>يمكن رفع PNG/WebP/GIF/SVGA/MP4 إلى Storage أو وضع رابط خارجي. لا يحتاج التطبيق إلى إصدار APK جديد لتغيير الأصل.</p></div><div class="grid">';(data||[]).forEach(a=>{h+=`<div class="card asset"><img src="${a.image_url||''}"><div><b>${a.label||a.asset_key}</b><div>${a.area} • ${a.asset_type}</div><small>${a.image_url||'بدون رابط'}</small></div></div>`});h+='</div>';if(error)h='<div class="card">'+error.message+'</div>'+h;$('assets').innerHTML=h;$('assetForm').onsubmit=saveAsset}
async function saveAsset(e){e.preventDefault();const f=new FormData(e.target);let url=f.get('url')?.trim();const file=f.get('file');if(file&&file.size){const path='assets/'+crypto.randomUUID()+'-'+file.name;const up=await sb.storage.from('pharaoh-assets').upload(path,file,{upsert:false});if(up.error)return alert(up.error.message);url=sb.storage.from('pharaoh-assets').getPublicUrl(path).data.publicUrl}const row={area:f.get('area'),asset_key:f.get('key'),label:f.get('label'),asset_type:f.get('type'),image_url:url||null,is_animated:['gif','webp','svga','mp4','animation'].includes(f.get('type')),position_x:Number(f.get('x')||0),position_y:Number(f.get('y')||0),width:f.get('w')?Number(f.get('w')):null,height:f.get('h')?Number(f.get('h')):null,enabled:true,updated_at:new Date().toISOString()};const r=await sb.from('ui_assets').upsert(row,{onConflict:'area,asset_key'});if(r.error)alert(r.error.message);else loadAssets()}
async function loadFeatures(){const {data}=await sb.from('app_feature_controls').select('*').order('sort_order');$('features').innerHTML='<div class="card"><h2>🔘 التحكم في ظهور الوظائف</h2>'+ (data||[]).map(x=>`<div class="row card"><b>${x.title_ar||x.feature_key}</b><label>ظاهر <input type="checkbox" data-feature="${x.feature_key}" ${x.visible?'checked':''}></label><label>مفعل <input type="checkbox" data-enabled="${x.feature_key}" ${x.enabled?'checked':''}></label></div>`).join('')+'</div>';document.querySelectorAll('[data-feature]').forEach(i=>i.onchange=async()=>{const key=i.dataset.feature;await sb.from('app_feature_controls').update({visible:i.checked,updated_at:new Date().toISOString()}).eq('feature_key',key)});document.querySelectorAll('[data-enabled]').forEach(i=>i.onchange=async()=>{const key=i.dataset.enabled;await sb.from('app_feature_controls').update({enabled:i.checked,updated_at:new Date().toISOString()}).eq('feature_key',key)})}
async function loadStore(){const {data}=await sb.from('store_items').select('*').order('sort_order');$('store').innerHTML='<div class="card"><h2>🛍️ المتجر</h2>'+ (data||[]).map(x=>`<div class="row card"><b>${x.name}</b><span>${x.category}</span><span>${x.price_coins} 🪙</span><span>${x.asset_url||''}</span><button data-store="${x.id}" data-state="${!x.enabled}">${x.enabled?'إخفاء':'إظهار'}</button></div>`).join('')+'</div>';document.querySelectorAll('[data-store]').forEach(b=>b.onclick=async()=>{await sb.from('store_items').update({enabled:b.dataset.state==='true'}).eq('id',b.dataset.store);loadStore()})}
async function loadUsers(){const {data}=await sb.from('profiles').select('id,display_id,display_name,coins,is_charge_agent,is_host_agent,is_host_member,is_banned').order('created_at',{ascending:false}).limit(100);$('users').innerHTML='<div class="card"><h2>👥 الحسابات والوكالات</h2><p>تظهر هنا الحسابات الحقيقية من Supabase. إدارة الوكالات والأرصدة تتم عبر جداول الوكالات وعملياتها المصرح بها.</p>'+ (data||[]).map(x=>`<div class="row card"><b>${x.display_name||'بدون اسم'}</b><span>ID: ${x.display_id||'-'}</span><span>🪙 ${x.coins}</span><span>${x.is_charge_agent?'وكيل شحن':''} ${x.is_host_agent?'وكيل مضيف':''}</span><span>${x.is_banned?'محظور':''}</span></div>`).join('')+'</div>'}
async function loadAgencies(){const {data}=await sb.from('agencies').select('*').order('created_at',{ascending:false});const el=document.getElementById('users');el.innerHTML+=(`<div class="card"><h2>🏢 الوكالات</h2><form id="agencyForm" class="row"><input name="name" placeholder="اسم الوكالة"><select name="type"><option value="mixed">مختلطة</option><option value="charge">شحن</option><option value="host">مضيفين</option></select><input name="owner" placeholder="UUID مالك الوكالة"><input name="coins" type="number" placeholder="الرصيد الأولي"><button>إنشاء وكالة حقيقية</button></form><div class="grid">${(data||[]).map(a=>`<div class="card"><b>${a.name}</b><div>${a.agency_type} • 🪙 ${a.coins_balance}</div><div class="row"><input id="credit-${a.id}" type="number" placeholder="عملات"><button data-credit="${a.id}">شحن رصيد الوكالة</button></div></div>`).join('')}</div></div>`);const f=document.getElementById('agencyForm');f.onsubmit=async e=>{e.preventDefault();const d=new FormData(f);const {error}=await sb.rpc('admin_create_agency',{p_name:d.get('name'),p_type:d.get('type'),p_owner_user_id:d.get('owner'),p_coins:Number(d.get('coins')||0)});if(error)alert(error.message);else loadAgencies()};document.querySelectorAll('[data-credit]').forEach(b=>b.onclick=async()=>{const n=Number(document.getElementById('credit-'+b.dataset.credit).value);const {error}=await sb.rpc('admin_credit_agency',{p_agency_id:b.dataset.credit,p_coins:n,p_note:'لوحة التحكم'});if(error)alert(error.message);else loadAgencies()})}
boot();
</script></body></html>
