<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n    <meta charset=\"UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n    <title>Digital Clock - Multiple Time Zones</title>\n    <link rel=\"stylesheet\" href=\"style.css\">\n</head>\n<body>\n    <div class=\"container\">\n        <h1>🕐 World Time Zones</h1>\n        \n        <div class=\"controls\">\n            <input type=\"text\" id=\"searchInput\" placeholder=\"Search timezone...\" class=\"search-box\">\n            <button id=\"addClockBtn\" class=\"add-btn\">+ Add Time Zone</button>\n        </div>\n\n        <div class=\"clocks-grid\" id=\"clocksGrid\">\n            <!-- Clocks will be dynamically added here -->\n        </div>\n\n        <!-- Modal for adding new timezone -->\n        <div id=\"timezoneModal\" class=\"modal\">\n            <div class=\"modal-content\">\n                <span class=\"close\">&times;</span>\n                <h2>Select Time Zone</h2>\n                <input type=\"text\" id=\"timezoneSearch\" placeholder=\"Search time zones...\" class=\"timezone-search\">\n                <div id=\"timezoneList\" class=\"timezone-list\">\n                    <!-- Will be populated with timezone options -->\n                </div>\n            </div>\n        </div>\n    </div>\n\n    <script src=\"script.js\"></script>\n</body>\n</html>\n
